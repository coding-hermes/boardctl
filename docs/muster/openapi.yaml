openapi: 3.0.3
info:
  title: boardctl serve
  description: |
    Loopback uploader/report HTTP surface of `boardctl serve` (BT-021),
    published as an OpenAPI 3.0.3 contract for muster consumption
    (BT-062). serve is loopback-only by design: it refuses any
    non-loopback --addr host, keeps no auth, and writes nothing to the
    uploaded board files. Board files themselves are JSONL
    (tasks.jsonl / events.jsonl / board.jsonl); the report is a
    self-contained HTML page.
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8787
    description: |
      Default loopback listener of `boardctl serve` (--addr default
      127.0.0.1:8787). ABSOLUTE on purpose: muster dereferences
      servers[].url as-is when --base-url is omitted, and a relative
      server URL cannot be dereferenced from a local-file spec. Override
      with --base-url (openapi-cli) or the mcpServers args (openapi-mcp)
      when the server runs on another loopback spelling or port.
tags:
  - name: uploader
    description: browser-facing uploader form and report rendering
  - name: boards
    description: live board inventory of the running serve instance
paths:
  '/':
    get:
      operationId: getUploaderForm
      summary: the self-contained uploader page (HTML form for folder and .zip uploads)
      tags: [uploader]
      description: |
        Serves the self-contained uploader page (inline CSS+JS, no
        external fetches). A browser form POSTs to `/` with
        multipart/form-data: field `files` (webkitdirectory folder
        upload, relative paths preserved) or field `zip` (one .zip
        archive). Paths other than `/` answer 404 via mux routing.
      responses:
        '200':
          description: the uploader HTML page
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: uploadBoardReport
      summary: upload a board folder or .zip and receive the rendered multi-board HTML report
      tags: [uploader]
      description: |
        Accepts a multipart/form-data upload of a board folder
        (webkitdirectory: every file under the chosen directory, one
        part per file, relative paths preserved in the filenames) or a
        single .zip part. Every directory containing BOTH
        tasks.jsonl and events.jsonl registers as a board (Topology A
        or B); a `board.jsonl` header row is honored for Topology A.
        Caps: 512 MB payload (HTTP 413 above), 50 boards per upload
        (HTTP 413 above). The response IS the rendered multi-board
        HTML report; nothing is written to the uploaded board files.
        Note: an upload that registers 0 boards while a -C board is
        loaded still answers 200 with the -C board's report plus a
        visible upload_notice banner (BT-027) — it does not error.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BoardUpload'
      responses:
        '200':
          description: the rendered multi-board analytics report (self-contained HTML; carries an upload_notice banner when the upload registered 0 boards but a -C board rendered)
          content:
            text/html:
              schema:
                type: string
        '400':
          description: bad multipart form, unreadable zip, no files, or no board found in the upload (plain-text error body)
          content:
            text/plain:
              schema:
                type: string
        '413':
          description: payload exceeds the 512 MB cap, or the upload registers more than 50 boards
          content:
            text/plain:
              schema:
                type: string
  '/api/board/{slug}':
    get:
      operationId: getBoardDetail
      summary: one board's full read model (rows, header, derived analytics, validate findings, loaded_at) from its load-time snapshot
      tags: [boards]
      description: |
        Answers with one board's full read model (R7): header, task rows,
        events, fixture ids, parse warnings, the derived analytics block
        (the same values render.BuildBoards produces for the snapshot),
        the validate findings (level + verbatim message with line
        numbers), the key-uniformity census line, the sweep-status READ
        census, and loaded_at (R9). Identity key: the report slug. The
        snapshot was computed once at load time (the -C resolve or an
        upload): files changing on disk afterwards never change this
        answer until a new upload or a serve restart. Unknown slug:
        404 with a JSON body (R8).
      parameters:
        - name: slug
          in: path
          required: true
          description: the board's report slug (the slugified report name)
          schema:
            type: string
      responses:
        '200':
          description: the board's snapshot read model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDetail'
        '404':
          description: unknown slug (JSON body naming the requested slug)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  '/api/boards':
    get:
      operationId: listLoadedBoards
      summary: list the boards currently loaded by the running serve instance
      tags: [boards]
      description: |
        Answers with the boards currently loaded by the running serve
        instance: the optional -C board plus every board registered by
        uploads so far (superseded re-uploads dropped). Board task
        totals come from the same payload derivation as the report
        (fixture exclusion, last-row-wins dedup), so the numbers match
        what the report page shows.
      responses:
        '200':
          description: the loaded boards (possibly an empty array)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiBoard'
        '500':
          description: board payload could not be built (plain-text error body)
          content:
            text/plain:
              schema:
                type: string
  '/api/events/{slug}':
    get:
      operationId: getBoardEvents
      summary: one board's event rows with the detail ladder already applied, from its load-time snapshot
      tags: [boards]
      description: |
        Answers with one board's event rows (R7), each carrying the
        analytics 2.4 detail ladder ALREADY APPLIED (R6: the decoding is
        Go's job): detail is an object/array when stored as one or
        wrapped as a JSON string or strict base64-wrapped JSON, and the
        raw string only on ladder fall-through (kept inert downstream).
        Served from the same load-time snapshot as GET
        /api/board/{slug}. Unknown slug: 404 with a JSON body (R8).
      parameters:
        - name: slug
          in: path
          required: true
          description: the board's report slug (the slugified report name)
          schema:
            type: string
      responses:
        '200':
          description: the board's event rows with decoded details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiEvent'
        '404':
          description: unknown slug (JSON body naming the requested slug)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  '/ui':
    get:
      operationId: getWebUI
      summary: the self-contained web UI (board viewer over the loaded snapshots; read-only)
      tags: [uploader]
      description: |
        Serves the BT-075 web UI: one self-contained HTML document (inline
        CSS+JS, no external assets, R17) with the initial snapshot island
        embedded (R18) so the overview renders even when the /api routes
        fail. Read-only: the UI holds zero write surfaces (D3/R20); the
        uploader stays at `/` and the UI only links to it (R2). The UI is
        provide-dont-force: nothing schedules, hooks or requires it (D6).
      responses:
        '200':
          description: the web UI page (self-contained HTML with the embedded snapshot island)
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    BoardUpload:
      type: object
      description: |
        multipart/form-data body of POST `/`. Exactly one of the two
        shapes is required: a single `zip` part (a .zip archive of one
        or more board directories, max 512 MB) OR a `files` folder
        upload (one part per file, wire filenames carrying the
        directory-relative paths). A `zip` part wins when both are
        present (handleUpload checks zip first).
      properties:
        zip:
          type: string
          format: binary
          description: one .zip archive containing one or more board directories (a directory holding BOTH tasks.jsonl and events.jsonl)
        files:
          type: array
          description: webkitdirectory folder upload — every file under the chosen directory, directory-relative paths preserved in the part filenames
          items:
            type: string
            format: binary
    ApiBoard:
      type: object
      description: one entry of GET /api/boards (mirrors cmd/boardctl apiBoard's json wire shape)
      properties:
        name:
          type: string
          description: board display name (header project, else the directory base name)
        slug:
          type: string
          description: report-display slug of the name
        topology:
          type: string
          description: board topology (A = board.jsonl header + tasks.jsonl, B = tasks.jsonl only)
        task_total:
          type: integer
          description: non-fixture task rows counted by the report payload derivation
          format: int64
        done:
          type: integer
          description: complete task count
          format: int64
        open:
          type: integer
          description: open task count
          format: int64
        validate_pill:
          type: string
          description: BT-075 additive — snapshot-time validate verdict PASS/WARN/FAIL (R2 keeps every pre-existing key load-bearing)
        loaded_at:
          type: string
          description: BT-075 additive — RFC3339 time the board's snapshot was loaded (R9)
    BoardDetail:
      type: object
      description: one board's full read model of GET /api/board/{slug} (BT-075 R7) — values are exactly what render.BuildBoards produces for the snapshot
      properties:
        name:
          type: string
        slug:
          type: string
        topology:
          type: string
        header:
          type: object
          nullable: true
          description: the raw board header row (null when the board has none)
        tasks:
          type: array
          description: raw task rows, verbatim as the report payload embeds them
          items:
            type: object
        events:
          type: array
          description: raw event rows, verbatim as the report payload embeds them
          items:
            type: object
        fixture_ids:
          type: array
          items:
            type: string
        parse_warnings:
          type: object
          description: per-file parse-warning counts plus the first notes (analytics 2.7)
        derived:
          type: object
          description: the board-report/v1 derived analytics block (burndown, burnup, velocity, cycle, streaks, tick_health, work_clock, model_share, status/priority counts)
        validate:
          type: object
          description: the snapshot-time validate result per R13 — pill + findings + census + sweep READ census
          properties:
            pill:
              type: string
              description: PASS (0 errors, any warnings), WARN (warnings only), FAIL (>=1 error)
            errors:
              type: integer
            warnings:
              type: integer
            findings:
              type: array
              items:
                type: object
                properties:
                  level:
                    type: string
                    description: error | warn
                  message:
                    type: string
                    description: verbatim validate message with line numbers (F9)
            census:
              type: string
              description: the key-uniformity census line, verbatim (F9/BT-056)
            sweep_census:
              type: object
              description: REVIEW-BOARDCTL-001 read census — no decisions are ever applied
              properties:
                rows:
                  type: integer
                off_vocabulary:
                  type: integer
                fixable_by_normalize:
                  type: integer
                need_explicit_decision:
                  type: integer
                unknown_rows:
                  type: array
                  items:
                    type: string
                  description: ids of rows carrying unknown statuses, named (never guessed at)
                decisions_note:
                  type: string
        loaded_at:
          type: string
          description: RFC3339 time this snapshot was loaded (R9)
    ApiEvent:
      type: object
      description: one event row of GET /api/events/{slug} with the detail ladder already applied
      properties:
        id:
          description: event id as stored (number or string)
        timestamp:
          type: string
        event_type:
          type: string
        task_id:
          nullable: true
          description: top-level task linkage (null for board-level events)
        actor:
          type: string
        detail:
          nullable: true
          description: the DECODED detail (object/array; raw string only on ladder fall-through)
        tick_number:
          nullable: true
    ApiError:
      type: object
      description: the R8 JSON 404 body of the read-only endpoints
      properties:
        error:
          type: string
          description: names the requested slug
