guards:
  secrets: true
  lint: false
  tests: false
  test_mode: full
  # BT-070: 180s default kills go_tests under fleet load (16-core box at
  # loadavg ~30; the same guard passed at 180s on a quiet host 09-28/30).
  # Full-mode suite measures 100-205s standalone — 900s gives 4x headroom.
  test_timeout: 900
  go:
    build: true
    lint: true
    tests: true
defaults:
  model: deepseek-v4-flash
  api_key_env: GITREINS_LLM_API_KEY
  max_iterations: 200
  max_time: "30m"
evaluator:
  model: deepseek-v4-flash
  max_iterations: 200
  max_time: "30m"
  static_analysis_diagnostics: false
history:
  enabled: true
  storage: git
  max_verdicts: 1000
