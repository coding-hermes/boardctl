guards:
  secrets: true
  lint: false
  tests: false
  test_mode: full
  go:
    build: true
    lint: true
    tests: true
defaults:
  model: deepseek-v4-flash
  api_key_env: GITREINS_LLM_API_KEY
  max_iterations: 200
  max_time: "30m"
evaluator:
  model: deepseek-v4-flash
  max_iterations: 200
  max_time: "30m"
  static_analysis_diagnostics: false
history:
  enabled: true
  storage: git
  max_verdicts: 1000
