guards:
  allow_skips: true
  secrets: true
  lint: false
  tests: false
  test_mode: full
  # BT-070: 180s default kills go_tests under fleet load (16-core box at
  # loadavg ~30; the same guard passed at 180s on a quiet host 09-28/30).
  # Full-mode suite measures 100-205s standalone — 900s gives 4x headroom.
  test_timeout: 900
  # BT-088: the pre-commit hook budget must exceed test_timeout. At the code
  # default (300s) the hook cut the guard off mid-suite and reported a
  # fail-open PASS, warning on every commit in this repo. 1020s = 900s test
  # budget + 120s for the secrets/build/lint lanes that run before it.
  hook_timeout: 1020
  go:
    build: true
    lint: true
    tests: true
# DF-BOARDCTL-060 (2026-11-22): the tier-2 lane is `moonshotai/kimi-k3` served by
# OpenRouter. The PROVIDER (base URL) and credential have no config.yaml surface:
# engine/llm.py resolves those from GITREINS_LLM_BASE_URL / GITREINS_LLM_API_KEY
# only, so the host env is the authority and the model ids here are kept aligned
# with that lane (a DeepSeek model id paired with the OpenRouter endpoint 404s).
# Previous lane: accounts/fireworks/models/kimi-k3 @ api.fireworks.ai — DEAD since
# 2026-11-22: HTTP 412 PRECONDITION_FAILED, "Account ... is suspended".
defaults:
  model: moonshotai/kimi-k3
  api_key_env: GITREINS_LLM_API_KEY
  max_iterations: 200
  max_time: "30m"
evaluator:
  model: moonshotai/kimi-k3
  max_iterations: 200
  max_time: "30m"
  static_analysis_diagnostics: false
history:
  enabled: true
  storage: git
  max_verdicts: 1000
