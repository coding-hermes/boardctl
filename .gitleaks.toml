# GitReins — gitleaks configuration
# Auto-generated by 'gitreins init'. Edit to add project-specific exclusions.
# See: https://github.com/gitleaks/gitleaks#configuration

# Extend the default gitleaks ruleset so AWS/GitHub/GitLab/etc. patterns still run
[extend]
useDefault = true

# Catch all sk- prefixed API keys (OpenAI, OpenRouter, DeepSeek, etc.)
# 20+ chars — lower than gitleaks' default 32-char minimum
# RE2-safe boundary anchor (no lookbehind) to avoid mid-word FP on prose like "task-complete-unavailable"
[[rules]]
id = "sk-api-key"
description = "OpenAI/OpenRouter/DeepSeek API key (sk- prefix)"
regex = '''(?i)(?:^|[^a-zA-Z0-9])sk-[a-zA-Z0-9_-]{20,}'''

# GitHub personal access tokens — gitleaks' default rules missed
# ghp_... PATs in the 2026-08-14 dogfood (DF-012)
[[rules]]
id = "gitreins-github-pat"
description = "GitHub personal access token (ghp_ prefix)"
regex = '''\bghp_[A-Za-z0-9]{36,}'''

# GitLab personal access tokens
[[rules]]
id = "gitreins-gitlab-pat"
description = "GitLab personal access token (glpat- prefix)"
regex = '''\bglpat-[A-Za-z0-9_\-]{20,}'''

# GCP API keys
[[rules]]
id = "gitreins-gcp-api-key"
description = "GCP API key (AIza prefix)"
regex = '''\bAIza[0-9A-Za-z\_-]{35,}'''

[allowlist]
description = "Auto-generated by gitreins init — skip git internals, logs, and dependency dirs only; docs and specs ARE scanned for secrets"

paths = [
  '''\.git/''',
  '''\.gitreins/''',
  '''\.gitreins/history/''',
  '''.*\.log''',
  '''vendor/''',
]

# False positive, not a credential: an audit event's witness string literally
# reads "gitreins-tier2-iteration-cap-and-tier1-baseline-secrets commit=<sha>",
# so the default generic-api-key rule treats "secrets commit=" as key=value and
# reports the following sha. The match is our own tooling label, never a key,
# so allowlist the label prefix. regexTarget="match" is required: the rule's
# captured secret is the trailing sha, and the label only appears in the match
# text. Keep every future regex here written against the MATCH, not the secret.
regexTarget = "match"
regexes = [
  '''gitreins-tier2-[A-Za-z0-9_-]{10,}''',
]

