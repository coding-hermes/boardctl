name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: go test -count=1 -run TestGofmt ./internal/fmtcheck

      - name: Version-check
        run: go test -count=1 -run TestVersioncheck ./internal/versioncheck

      - name: Spec-check
        run: go test -count=1 ./internal/speccheck

      # BT-087: no .golangci* file may live under vendor/ — a vendored
      # upstream config is discovered by golangci-lint when the guard lints
      # a vendor package directory and aborts go_lint with "unknown
      # linters". `make vendor-strip` is the remedy after `go mod vendor`.
      - name: Vendor-check
        run: go test -count=1 -run TestVendorcheck ./internal/vendorcheck

      # BT-033: the dependency-vulnerability gate runs the pinned scanner, so
      # the "Install govulncheck v1.7.0" step must precede it (and the Test
      # step below, which also runs TestVulncheck).
      - name: Install govulncheck v1.7.0
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Vulnerability-check
        run: go test -count=1 -run TestVulncheck ./internal/vulncheck

      # BT-085: the coverage floor gate calls the make target itself, so the
      # floors (total 80%, per-package 60%, exempt internal/secretscheck)
      # live in the Makefile only and cannot drift between local and CI.
      - name: Coverage
        run: make cover-check

      - name: Test
        run: go test -short -count=1 ./...
